<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión de SalvaCiudad</title>
<style>
:root {
  --bg: #f6f3ec; --panel: #fffdf8; --panel-2: #f0ebe0; --text: #2b2620; --dim: #6f665a; --line: #d9cfbd;
  --accent: #b07b1c; --accent-soft: #f3e3bf;
  --good: #2f7a3e; --good-soft: #dcefdc; --warn: #9a6a00; --warn-soft: #f8ebc8; --bad: #a8412f; --bad-soft: #f6dcd5;
  --info: #2d5f9a; --info-soft: #dbe7f6; --muted: #857d70; --muted-soft: #ebe6dc;
  --shadow: 0 1px 2px rgba(60, 45, 20, .08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1a17; --panel: #25221e; --panel-2: #2e2a25; --text: #efe7d8; --dim: #a99f8e; --line: #423c33;
    --accent: #e0ac4c; --accent-soft: #4a3a1c;
    --good: #7cc98a; --good-soft: #20382a; --warn: #e3b75a; --warn-soft: #3d321a; --bad: #ec8a76; --bad-soft: #43251f;
    --info: #8ab6ec; --info-soft: #1e2d42; --muted: #a39a8b; --muted-soft: #34302a;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1a17; --panel: #25221e; --panel-2: #2e2a25; --text: #efe7d8; --dim: #a99f8e; --line: #423c33;
  --accent: #e0ac4c; --accent-soft: #4a3a1c;
  --good: #7cc98a; --good-soft: #20382a; --warn: #e3b75a; --warn-soft: #3d321a; --bad: #ec8a76; --bad-soft: #43251f;
  --info: #8ab6ec; --info-soft: #1e2d42; --muted: #a39a8b; --muted-soft: #34302a;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
button, select, input, textarea { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
h1 { font-size: 18px; margin: 0; font-weight: 650; }
.file { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status { font-size: 13px; color: var(--dim); }
.status.warn { color: var(--warn); } .status.bad { color: var(--bad); } .status.good { color: var(--good); }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
nav.tabs { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 2px; }
nav.tabs button { background: none; border: none; border-bottom: 3px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--dim); white-space: nowrap; }
nav.tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs .n { font-size: 12px; background: var(--panel-2); border-radius: 9px; padding: 0 6px; margin-left: 4px; }
nav.tabs .n.hot { background: var(--accent); color: #fff; }
main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 60px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters input[type=search] { flex: 1 1 220px; min-width: 0; }
.filters input, .filters select { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
.bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; background: var(--panel-2); border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
.intro { color: var(--dim); margin: 0 0 12px; }
h2.group { font-size: 14px; color: var(--dim); text-transform: none; margin: 20px 0 6px; font-weight: 600; letter-spacing: .01em; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; box-shadow: var(--shadow); }
.card.retired { opacity: .6; }
.head { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 10px 12px; }
.head input[type=checkbox] { margin-top: 4px; }
.title { cursor: pointer; }
.title .t { font-weight: 560; }
.meta { font-size: 12px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.chip { font-size: 12px; border-radius: 10px; padding: 0 7px; background: var(--panel-2); }
.flag { font-size: 12px; border-radius: 10px; padding: 0 7px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
select.state { border-radius: 14px; padding: 3px 8px; border: 1px solid transparent; font-size: 13px; font-weight: 600; cursor: pointer; }
.s-neutral { background: var(--panel-2); color: var(--dim); } .s-good { background: var(--good-soft); color: var(--good); }
.s-warn { background: var(--warn-soft); color: var(--warn); } .s-bad { background: var(--bad-soft); color: var(--bad); }
.s-info { background: var(--info-soft); color: var(--info); } .s-muted { background: var(--muted-soft); color: var(--muted); }
.body { padding: 0 12px 12px 40px; display: none; }
.card.open .body { display: block; }
.detail { color: var(--text); font-size: 14px; }
.detail p { margin: 6px 0; } .detail ul { margin: 4px 0 4px 18px; padding: 0; }
.detail code { background: var(--panel-2); border-radius: 4px; padding: 0 4px; font-size: 13px; }
.answer { margin-top: 8px; border-left: 3px solid var(--info); background: var(--info-soft); padding: 6px 10px; border-radius: 0 6px 6px 0; font-size: 14px; }
.answer b { color: var(--info); }
label.note { display: block; margin-top: 10px; font-size: 13px; color: var(--dim); }
.note-actions { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.note-actions .hint { font-size: 12px; color: var(--dim); }
.note-actions .hint.warn { color: var(--warn); font-weight: 600; }
textarea.draft { border-color: var(--warn); }
textarea { width: 100%; min-height: 58px; resize: vertical; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; margin-top: 3px; }
details.hist { margin-top: 8px; font-size: 13px; color: var(--dim); }
details.hist li { margin: 2px 0; }
.original { white-space: pre-wrap; font-size: 14px; background: var(--panel-2); border-radius: 7px; padding: 8px 10px; margin: 4px 0; }
.analysis { border-left: 3px solid var(--accent); padding: 2px 10px; margin: 4px 0; }
.analysis > b { color: var(--accent); font-size: 13px; }
.options { display: grid; gap: 6px; margin: 10px 0 4px; }
.option { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.option:hover { border-color: var(--accent); }
.option.on { border-color: var(--good); background: var(--good-soft); }
.option input { margin-top: 4px; }
.option .flag { margin-left: 6px; }
.option .desc { display: block; font-size: 13px; color: var(--dim); }
.newidea { margin-bottom: 14px; }
.newidea textarea { min-height: 80px; }
.newidea select { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
h2.group .count { font-weight: 400; }
details.legend-help { font-size: 13px; color: var(--dim); margin: -6px 0 12px; }
details.legend-help ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 3px; }
details.legend-help .chip { font-weight: 600; }
.empty { color: var(--dim); padding: 30px 0; text-align: center; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.box h3 { margin: 0 0 8px; font-size: 15px; }
.stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--panel-2); margin: 6px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; }
table.phases { width: 100%; border-collapse: collapse; font-size: 13px; }
table.phases th, table.phases td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.phases .num { text-align: right; font-variant-numeric: tabular-nums; }
.welcome { max-width: 640px; margin: 50px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
.welcome h2 { margin-top: 0; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: .95; }
@media (max-width: 640px) {
  .head { grid-template-columns: auto 1fr; } .head select.state { grid-column: 2; justify-self: start; }
  .body { padding-left: 12px; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Revisión de SalvaCiudad</h1>
    <div class="file">
      <span class="status" id="status">Sin archivo abierto</span>
      <button class="btn primary" id="open">Abrir revision.json</button>
      <button class="btn" id="reconnect" hidden>Reconectar</button>
      <button class="btn" id="save" hidden>Guardar</button>
      <button class="btn" id="download" hidden title="Para navegadores que no pueden escribir en el archivo">Descargar</button>
      <button class="btn" id="theme" title="Tema claro u oscuro">◐</button>
      <input type="file" id="picker" accept=".json,application/json" hidden>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
'use strict';

// ---- Kinds, states and how they look -------------------------------------------------------
const TABS = [
  {id: 'atencion', label: 'Requiere tu atención'},
  {id: 'cambio', label: 'Cambios', intro: 'Qué se implementó en cada fase. Márcalo revisado o aprobado; si algo está mal, "con problemas" y escribe qué.'},
  {id: 'prueba', label: 'Pruebas manuales', intro: 'La lista de verificación del README, por fase. Si algo falla, márcalo y describe qué viste.'},
  {id: 'decision', label: 'Decisiones', intro: 'Todas las decisiones de docs/DECISIONES.md. Apruébalas, pide un cambio o pide que se definan mejor.'},
  {id: 'confirmar', label: 'Por confirmar', intro: 'Decisiones que tomé por mi cuenta y conviene que confirmes o rechaces.'},
  {id: 'idea', label: 'Ideas', intro: 'Tus ideas tal como las escribiste, y las mías (marcadas "de Claude"): sugerencias y trabajo que quedó abierto. Agrega las nuevas aquí o en el chat; cuando quieras, pídeme refinarlas.'},
  {id: 'correccion', label: 'Correcciones', intro: 'Fallas y mejoras pequeñas que encuentras al probar. Marca "autorizada" lo que quieres que corrija; cuando esté "corregida", pruébala y márcala "verificada", o regrésala a "autorizada" con una nota.'},
  {id: 'analisis', label: 'Análisis', intro: 'Mi análisis de cada idea y las preguntas que necesito. Elige "para el plan", "ajustar", "para después" o "descartada", y responde las preguntas; luego dime "revisa el registro".'},
  {id: 'resumen', label: 'Resumen'},
];
const KIND_LABEL = {cambio: 'Cambio', prueba: 'Prueba', decision: 'Decisión', confirmar: 'Por confirmar', sugerencia: 'Sugerencia', pendiente: 'Pendiente',
  idea: 'Idea', pregunta: 'Pregunta', correccion: 'Corrección'};
const TONE = {
  'sin revisar': 'neutral', 'sin probar': 'neutral', 'pendiente': 'neutral', 'abierto': 'neutral', 'nueva': 'neutral', 'sin responder': 'neutral',
  'revisado': 'good', 'aprobado': 'good', 'aprobada': 'good', 'funciona': 'good', 'confirmado': 'good', 'implementada': 'good', 'hecho': 'good',
  'para el plan': 'good', 'planeada': 'good', 'respondida': 'good', 'verificada': 'good',
  'autorizada': 'info', 'autorizado': 'info', 'en curso': 'info', 'analizada': 'info', 'corregida': 'info',
  'requiere definición': 'warn', 'requiere cambio': 'warn', 'con problemas': 'warn', 'ajustar': 'warn', 'no se reproduce': 'warn',
  'pospuesta': 'muted', 'pospuesto': 'muted', 'para después': 'muted',
  'falla': 'bad', 'rechazado': 'bad', 'descartada': 'bad', 'descartado': 'bad', 'no aplica': 'muted',
};
const TONE_COLOR = {neutral: '--dim', good: '--good', info: '--info', warn: '--warn', bad: '--bad', muted: '--muted'};
// States that ask Claude to act (same list as tools/revision/revision.py).
const FOR_CLAUDE = new Set(['con problemas', 'falla', 'requiere cambio', 'confirmado', 'rechazado', 'autorizada', 'autorizado', 'requiere definición',
  'para el plan', 'ajustar', 'respondida']);
// What each state means. Each one says who sets it: "Tú" is Salvador, "Claude" is Claude.
const STATE_HELP = {
  cambio: {'sin revisar': 'Así empieza: aún no lo revisas.', 'revisado': 'Lo pones tú: lo viste, sin comentarios.',
    'aprobado': 'Lo pones tú: lo viste y está bien así.', 'con problemas': 'Lo pones tú: algo está mal. Escribe qué en tu nota y Claude lo corrige.'},
  prueba: {'sin probar': 'Así empieza: aún no la haces.', 'funciona': 'Lo pones tú: la hiciste y salió como se esperaba.',
    'falla': 'Lo pones tú: no salió bien. Describe en tu nota qué viste; Claude la convierte en una corrección autorizada.',
    'no aplica': 'Lo pones tú: ya no tiene sentido probarla.'},
  decision: {'sin revisar': 'Así empieza: aún no la lees.', 'aprobada': 'Lo pones tú: estás de acuerdo.',
    'requiere cambio': 'Lo pones tú: quieres otra cosa; dilo en tu nota.',
    'requiere definición': 'Lo pones tú: no queda claro. Claude te responde con preguntas o una propuesta.',
    'descartada': 'Lo pones tú: no se hará así o ya no se necesita.'},
  confirmar: {'pendiente': 'Así empieza: Claude lo decidió por su cuenta y espera que lo confirmes.',
    'confirmado': 'Lo pones tú: está bien lo que decidió Claude (o elegiste la opción "lo que hice").',
    'rechazado': 'Lo pones tú: no estás de acuerdo; elegiste otra opción o dijiste en tu nota qué prefieres. Claude lo cambia.',
    'requiere definición': 'Lo pones tú: necesitas más información para decidir.'},
  idea: {'nueva': 'Así empieza: anotada, todavía sin el análisis de Claude.',
    'analizada': 'Lo pone Claude: ya escribió su análisis. Ahora decides tú: para el plan, ajustar, para después o descartada.',
    'para el plan': 'Lo pones tú: entra en el plan de trabajo.', 'ajustar': 'Lo pones tú: entra, con los cambios que digas en tu nota.',
    'para después': 'Lo pones tú: se guarda para otra ronda.', 'descartada': 'Lo pones tú: no se hará.',
    'planeada': 'Lo pone Claude: ya está en una fase del plan.'},
  pregunta: {'sin responder': 'Así empieza: la pregunta de Claude espera tu respuesta.',
    'respondida': 'Se pone solo cuando eliges una opción o escribes tu respuesta.',
    'requiere definición': 'Lo pones tú: la pregunta no queda clara y Claude te la replantea.'},
  correccion: {'nueva': 'Así empieza: anotada; aún no decides si se corrige.',
    'autorizada': 'Lo pones tú: Claude puede corregirla. También sirve para regresarla si sigue fallando.',
    'en curso': 'Lo pone Claude: la está corrigiendo.', 'corregida': 'Lo pone Claude: hecha y con commit. Pruébala en el juego.',
    'no se reproduce': 'Lo pone Claude: no logró provocar el problema y te pregunta cómo pasó.',
    'verificada': 'Lo pones tú: la probaste y quedó bien. Queda cerrada.', 'descartada': 'Lo pones tú: no se corrige.'},
};
function stateHelp(tipo, estado) { return (STATE_HELP[tipo] || {})[estado] || ''; }
function stateLegend(tipos) {
  const list = el('ul', {});
  for (const t of tipos) {
    for (const st of (doc.estados[t] || [])) {
      list.append(el('li', {}, el('span', {class: 'chip s-' + (TONE[st] || 'neutral')}, st),
        tipos.length > 1 ? ` (${KIND_LABEL[t].toLowerCase()})` : '', ' — ', stateHelp(t, st)));
    }
  }
  return el('details', {class: 'legend-help'}, el('summary', {}, '¿Qué significa cada estado?'), list);
}
// Written by Salvador on the page: numbered with its own prefix.
const CAPTURE = {
  idea: {prefix: 'I', title: 'Nueva idea', button: '+ Agregar idea', placeholder: 'Escribe la idea como te salga; yo no la cambio.', done: 'Idea'},
  correccion: {prefix: 'C', title: 'Nueva corrección', button: '+ Agregar corrección', done: 'Corrección',
    placeholder: 'Qué pasó, qué esperabas y cómo llegaste ahí (si lo sabes); yo no cambio el texto.'},
};
const AREAS = ['Juego', 'Interfaz', 'Red', 'Arte', 'Rendimiento', 'Mods', 'Herramientas', 'Otro'];
const USER = 'Salvador';

// ---- State -----------------------------------------------------------------------------------
let doc = null;             // The loaded revision.json.
let handle = null;          // FileSystemFileHandle, when the browser can write the file.
let lastModified = 0;       // Of the file as last read or written.
const dirty = new Map();    // id -> the item's user fields changed since the last save.
let saveTimer = 0;
let tab = 'atencion';
const filters = {q: '', fase: '', estado: '', nota: false, archivados: false, ocultarAtendidos: false};
try { filters.ocultarAtendidos = localStorage.getItem('revision.ocultarAtendidos') === '1'; } catch (e) { /* Shown by default. */ }
const open = new Set();     // Cards expanded.
const selected = new Set();
const canWrite = 'showOpenFilePicker' in window;

// ---- Small helpers ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('on');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('on'), 2600);
}
function now() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  const off = -d.getTimezoneOffset(), sign = off >= 0 ? '+' : '-';
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}` +
    `${sign}${p(Math.floor(Math.abs(off) / 60))}:${p(Math.abs(off) % 60)}`;
}
function fmtDate(iso) { return iso ? iso.replace('T', ' ').slice(0, 16) : ''; }
function faseKey(f) {
  const m = /^(\d+)([a-z]?)$/.exec(f || '');
  return m ? Number(m[1]) * 10 + (m[2] ? m[2].charCodeAt(0) - 96 : 0) : 100000;
}
// Writing a note: redrawing now would take the cursor away.
function typing() { const a = document.activeElement; return !!a && a.tagName === 'TEXTAREA'; }
function refresh() { if (typing()) renderTabs(); else render(); }
function setStatus(text, tone) { const s = $('status'); s.textContent = text; s.className = 'status' + (tone ? ' ' + tone : ''); }

// A small, safe subset of Markdown: paragraphs, lists, **bold** and `code`.
function markdown(text) {
  const box = el('div', {class: 'detail'});
  let list = null;
  const inline = (line) => {
    const frag = document.createDocumentFragment();
    const re = /(\*\*[^*]+\*\*|`[^`]+`)/g;
    let at = 0, m;
    while ((m = re.exec(line))) {
      frag.append(line.slice(at, m.index));
      frag.append(m[0][0] === '*' ? el('b', {}, m[0].slice(2, -2)) : el('code', {}, m[0].slice(1, -1)));
      at = m.index + m[0].length;
    }
    frag.append(line.slice(at));
    return frag;
  };
  for (const raw of (text || '').split('\n')) {
    const line = raw.trimEnd();
    const item = /^\s*[-*] (.*)$/.exec(line);
    if (item) {
      if (!list) { list = el('ul'); box.append(list); }
      list.append(el('li', {}, inline(item[1])));
    } else if (line.trim() === '') {
      list = null;
    } else {
      list = null;
      box.append(el('p', {}, inline(line)));
    }
  }
  return box;
}

// ---- What waits for whom ---------------------------------------------------------------------
function lastBy(it, who) {
  let last = '';
  for (const h of it.historial || []) if ((h.quien === 'Claude') === (who === 'Claude') && h.fecha > last) last = h.fecha;
  return last;
}
// Claude answered after Salvador's last word.
function claudeAnswered(it) { const c = lastBy(it, 'Claude'); return c !== '' && c > lastBy(it, USER); }
// Salvador asked Claude to act and Claude has not answered yet.
function forClaude(it) {
  // An authorized correction waits for Claude whoever authorized it (same rule as revision.py).
  if (it.tipo === 'correccion' && it.estado === 'autorizada' && !it.archivado) return true;
  const u = lastBy(it, USER);
  return u !== '' && u > lastBy(it, 'Claude') && (FOR_CLAUDE.has(it.estado) || !!it.nota);
}
// Questions always offer options; a confirmation may.
function hasOptions(it) { return it.tipo === 'pregunta' || it.opciones !== undefined; }
// Still waits for Salvador: in its first state, or with something new to read.
// Everything else counts as attended to (tab counters, and last in the lists).
function pending(it) {
  return !it.retirado && !it.archivado && (it.estado === doc.estados[it.tipo][0] || needsUser(it));
}
function needsUser(it) {
  if (it.retirado || it.archivado) return false;
  if (claudeAnswered(it)) return true;
  return (it.tipo === 'confirmar' && it.estado === 'pendiente') || (it.tipo === 'idea' && it.estado === 'analizada') ||
    (it.tipo === 'correccion' && (it.estado === 'corregida' || it.estado === 'no se reproduce')) ||
    (it.tipo === 'pregunta' && it.estado === 'sin responder');
}

// ---- Loading and saving ----------------------------------------------------------------------
function validate(data) {
  if (!data || typeof data !== 'object' || data.schemaVersion !== 1 || !Array.isArray(data.items) || typeof data.estados !== 'object') {
    throw new Error('No es un revision.json de esta versión.');
  }
  let bad = 0;
  data.items = data.items.filter((it) => {
    const ok = it && typeof it.id === 'string' && Array.isArray(data.estados[it.tipo]) && typeof it.titulo === 'string' &&
      data.estados[it.tipo].includes(it.estado) && (!hasOptions(it) || validOptions(it.opciones));
    if (!ok) bad++;
    else {
      it.nota = typeof it.nota === 'string' ? it.nota : '';
      it.historial = Array.isArray(it.historial) ? it.historial : [];
      if (hasOptions(it)) it.eleccion = cleanChoice(it, it.eleccion);
    }
    return ok;
  });
  if (bad) toast(`${bad} elemento(s) dañado(s) se ignoraron.`);
  return data;
}
// Same rules as tools/revision/revision.py: two or more options, distinct labels.
function validOptions(opts) {
  if (!Array.isArray(opts) || opts.length < 2) return false;
  const labels = opts.map((o) => (o && typeof o === 'object' ? o.etiqueta : null));
  return labels.every((x) => typeof x === 'string' && x.trim()) && new Set(labels).size === labels.length &&
    opts.every((o) => (o.descripcion === undefined || typeof o.descripcion === 'string') && (o.recomendada === undefined || typeof o.recomendada === 'boolean') &&
      (o.actual === undefined || typeof o.actual === 'boolean'));
}
function cleanChoice(q, chosen) {
  const list = Array.isArray(chosen) ? chosen : [];
  const kept = q.opciones.map((o) => o.etiqueta).filter((x) => list.includes(x));
  return q.multiple === true ? kept : kept.slice(0, 1);
}
// Salvador's fields of an item, as kept in `dirty` and written by save().
function userFields(it) {
  const out = {estado: it.estado, nota: it.nota, actualizado: it.actualizado};
  if (hasOptions(it)) out.eleccion = it.eleccion;
  return out;
}
function applyMine(it, mine) {
  if (mine.texto && textStillEditable(it, mine.texto)) { it.detalle = mine.texto.detalle; it.titulo = ideaTitle(mine.texto.detalle); }
  // The state only if Salvador chose one: a note or a text edit never undoes a state Claude set meanwhile.
  const chose = (mine.historial || []).some((h) => h.accion === 'estado' || h.accion === 'eleccion');
  if (chose && doc.estados[it.tipo].includes(mine.estado)) it.estado = mine.estado;
  it.nota = typeof mine.nota === 'string' ? mine.nota : it.nota;
  it.actualizado = mine.actualizado;
  if (hasOptions(it) && mine.eleccion) it.eleccion = cleanChoice(it, mine.eleccion);
}
// Salvador's own idea or correction, while nobody has worked on it yet (D-9015).
function textEditable(it) {
  return (it.tipo === 'idea' || it.tipo === 'correccion') && it.estado === 'nueva' && it.autor !== 'Claude' && !it.prueba && !it.archivado;
}
// On disk it is still as Salvador last saw it.
function textStillEditable(it, texto) {
  return it.estado === 'nueva' && (it.detalle === texto.antes || it.detalle === texto.detalle);
}
// Claude analyzed it meanwhile: the new text is kept as a note instead, never lost.
function keepTextAsNote(it, texto) {
  if (it.detalle === texto.detalle) return;
  const fecha = now();
  it.nota = (it.nota ? it.nota + '\n\n' : '') + 'Texto que quise poner:\n' + texto.detalle;
  it.historial.push({id: fecha + '-' + Math.random().toString(36).slice(2, 8), fecha, quien: USER, accion: 'nota', estado: it.estado, texto: it.nota});
  toast(`${it.id} ya estaba analizada: tu texto nuevo quedó como nota.`);
}
// An idea or correction written on this page, as kept in local storage until it is saved.
function isIdea(it) {
  const c = it && CAPTURE[it.tipo];
  return !!c && new RegExp('^' + c.prefix + '-\\d+$').test(it.id) && typeof it.titulo === 'string' && typeof it.detalle === 'string' &&
    it.detalle.trim() !== '' && AREAS.includes(it.area) && it.estado === 'nueva' && Array.isArray(it.historial);
}
function nextIdeaId(items, tipo) {
  const prefix = CAPTURE[tipo].prefix;
  let top = 0;
  for (const it of items) { const m = new RegExp('^' + prefix + '-(\\d+)$').exec(it.id); if (m) top = Math.max(top, Number(m[1])); }
  return prefix + '-' + String(top + 1).padStart(3, '0');
}
function useDoc(data) {
  doc = validate(data);
  // Edits not yet written (a closed tab, a failed save) come back.
  try {
    const kept = JSON.parse(localStorage.getItem('revision.unsaved') || '{}');
    let restored = 0;
    const known = new Set(doc.items.map((it) => it.id));
    for (const [id, k] of Object.entries(kept)) {
      // An idea written here that never reached the file.
      if (k && k.nueva && !known.has(id) && isIdea(k.nueva)) { doc.items.push(k.nueva); known.add(id); }
    }
    for (const it of doc.items) {
      const k = kept[it.id];
      if (k && k.actualizado && (!it.actualizado || k.actualizado > it.actualizado)) {
        applyMine(it, k);
        const seen = new Set(it.historial.map(entryKey));
        for (const h of k.historial || []) if (!seen.has(entryKey(h))) it.historial.push(h);
        dirty.set(it.id, k); restored++;
      }
    }
    if (restored) { toast(`${restored} cambio(s) sin guardar recuperados.`); scheduleSave(); }
  } catch (e) { /* No local storage: nothing to restore. */ }
  render();
}
async function readHandle() {
  const file = await handle.getFile();
  lastModified = file.lastModified;
  return JSON.parse(await file.text());
}
async function openFile() {
  if (!canWrite) { $('picker').click(); return; }
  try {
    [handle] = await window.showOpenFilePicker({types: [{description: 'revision.json', accept: {'application/json': ['.json']}}]});
  } catch (e) { return; }
  try {
    useDoc(await readHandle());
    await remember(handle);
    setStatus('Guardado automático en ' + handle.name, 'good');
    showButtons();
  } catch (e) { setStatus('No se pudo leer: ' + e.message, 'bad'); }
}
function entryKey(h) { return h.id || [h.fecha, h.quien, h.estado, h.texto].join('|'); }
const drafts = new Map();   // id -> a note being written, not saved yet.
try { for (const [k, v] of Object.entries(JSON.parse(localStorage.getItem('revision.drafts') || '{}'))) drafts.set(k, String(v)); }
catch (e) { /* No drafts kept. */ }
function keepDrafts() {
  try { localStorage.setItem('revision.drafts', JSON.stringify(Object.fromEntries(drafts))); } catch (e) { /* Only in memory. */ }
}
function keepUnsaved() {
  try {
    const out = {};
    for (const [id, v] of dirty) out[id] = v;
    localStorage.setItem('revision.unsaved', JSON.stringify(out));
  } catch (e) { /* Private window: only in memory. */ }
}
function scheduleSave() {
  keepUnsaved();
  setStatus(`${dirty.size} cambio(s) sin guardar`, 'warn');
  clearTimeout(saveTimer);
  if (handle) saveTimer = setTimeout(save, 900);
}
// Writes Salvador's edits into the file as it is now on disk, so what Claude
// wrote meanwhile (answers, new items) is kept.
async function save() {
  if (!handle || dirty.size === 0) return;
  try {
    if ((await handle.queryPermission({mode: 'readwrite'})) !== 'granted' &&
        (await handle.requestPermission({mode: 'readwrite'})) !== 'granted') {
      setStatus('Sin permiso para escribir: pulsa Guardar', 'bad'); return;
    }
    const disk = validate(await readHandle());
    const byId = new Map(disk.items.map((it) => [it.id, it]));
    const writing = new Map(dirty);  // Edits made while writing stay for the next save.
    for (const [id, mine] of writing) {
      let it = byId.get(id);
      if (mine.nueva && (!it || it.detalle !== mine.nueva.detalle)) {
        // An idea written here. If Claude took its number meanwhile, it gets the next one.
        it = Object.assign({}, mine.nueva, {id: it ? nextIdeaId(disk.items, mine.nueva.tipo) : id, historial: []});
        disk.items.push(it);
        byId.set(it.id, it);
      }
      if (!it) continue;
      const textOk = !mine.texto || textStillEditable(it, mine.texto);
      applyMine(it, mine);
      if (!textOk) keepTextAsNote(it, mine.texto);
      const seen = new Set(it.historial.map(entryKey));
      // A text change that did not apply leaves no "changed the text" entry.
      for (const h of mine.historial) if (!seen.has(entryKey(h)) && (textOk || h.accion !== 'texto')) it.historial.push(h);
      it.historial.sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
    }
    const text = JSON.stringify(disk, null, 1) + '\n';
    JSON.parse(text);
    const w = await handle.createWritable();   // Written to a temporary copy, swapped in on close.
    await w.write(text);
    await w.close();
    lastModified = (await handle.getFile()).lastModified;
    for (const [id, mine] of writing) if (dirty.get(id) === mine) dirty.delete(id);
    for (const [id, mine] of dirty) { const it = byId.get(id); if (it) applyMine(it, mine); }
    keepUnsaved();
    if (!dirty.size) { try { localStorage.removeItem('revision.unsaved'); } catch (e) { /* Nothing kept. */ } }
    doc = disk;
    setStatus(dirty.size ? `${dirty.size} cambio(s) sin guardar` : 'Guardado ' + fmtDate(now()).slice(11), dirty.size ? 'warn' : 'good');
    if (dirty.size) scheduleSave();
    refresh();
  } catch (e) {
    setStatus('No se pudo guardar: ' + e.message, 'bad');
  }
}
// Claude may update the file while the page is open: read it again when idle.
async function watch() {
  if (!handle || dirty.size || typing()) return;
  try {
    const file = await handle.getFile();
    if (file.lastModified > lastModified) {
      doc = validate(JSON.parse(await file.text()));
      lastModified = file.lastModified;
      render();
      toast('El archivo cambió en el disco: se volvió a leer.');
    }
  } catch (e) { /* Permission lapsed; the next save asks again. */ }
}
function download() {
  const blob = new Blob([JSON.stringify(doc, null, 1) + '\n'], {type: 'application/json'});
  const a = el('a', {href: URL.createObjectURL(blob), download: 'revision.json'});
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  dirty.clear();
  try { localStorage.removeItem('revision.unsaved'); } catch (e) { /* Nothing kept. */ }
  setStatus('Descargado: reemplaza docs/revision/revision.json con él', 'warn');
}

// The file handle survives a reload (IndexedDB); permission is asked again.
function idb() {
  return new Promise((ok, fail) => {
    const r = indexedDB.open('revision', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => ok(r.result);
    r.onerror = () => fail(r.error);
  });
}
async function remember(h) {
  try { const db = await idb(); db.transaction('h', 'readwrite').objectStore('h').put(h, 'file'); } catch (e) { /* Not kept. */ }
}
async function recall() {
  try {
    const db = await idb();
    return await new Promise((ok) => {
      const r = db.transaction('h').objectStore('h').get('file');
      r.onsuccess = () => ok(r.result || null);
      r.onerror = () => ok(null);
    });
  } catch (e) { return null; }
}
async function reconnect() {
  try {
    if ((await handle.requestPermission({mode: 'readwrite'})) !== 'granted') return;
    useDoc(await readHandle());
    setStatus('Guardado automático en ' + handle.name, 'good');
    showButtons();
  } catch (e) { setStatus('No se pudo abrir: ' + e.message, 'bad'); }
}
function showButtons() {
  $('reconnect').hidden = true;
  $('save').hidden = !handle;
  $('download').hidden = !doc || !!handle;
  $('open').textContent = doc ? 'Abrir otro' : 'Abrir revision.json';
  $('open').classList.toggle('primary', !doc);
}

// ---- Editing ---------------------------------------------------------------------------------
// One history entry per deliberate action: a state chosen, or a note saved
// with its button (never the note while it is being typed).
function edit(it, changes) {
  const accion = changes.eleccion !== undefined ? 'eleccion' : changes.estado !== undefined ? 'estado' : 'nota';
  Object.assign(it, changes);
  it.actualizado = now();
  const texto = accion === 'nota' ? it.nota : accion === 'eleccion' ? it.eleccion.join(', ') : '';
  const entry = {id: it.actualizado + '-' + Math.random().toString(36).slice(2, 8), fecha: it.actualizado, quien: USER, accion,
    estado: it.estado, texto};
  it.historial.push(entry);
  const prev = dirty.get(it.id);
  dirty.set(it.id, Object.assign(userFields(it), {historial: [...(prev ? prev.historial : []), entry]},
    prev && prev.nueva ? {nueva: prev.nueva} : {}, prev && prev.texto ? {texto: prev.texto} : {}));
  scheduleSave();
}
function editText(it, text) {
  const antes = it.detalle;
  if (!text || text === antes || !textEditable(it)) return;
  const prev = dirty.get(it.id);
  it.detalle = text;
  it.titulo = ideaTitle(text);
  it.actualizado = now();
  const entry = {id: it.actualizado + '-' + Math.random().toString(36).slice(2, 8), fecha: it.actualizado, quien: USER, accion: 'texto',
    estado: it.estado, texto: antes};
  it.historial.push(entry);
  // "antes" stays the text on disk, even after several edits before a save.
  const base = prev && prev.texto ? prev.texto.antes : antes;
  dirty.set(it.id, Object.assign(userFields(it), {historial: [...(prev ? prev.historial : []), entry], texto: {antes: base, detalle: text}},
    prev && prev.nueva ? {nueva: prev.nueva} : {}));
  scheduleSave();
}
// An idea or correction written on this page. It goes to the file on the
// next save, with the next free number.
function addIdea(tipo, area, text) {
  const fecha = now();
  const it = {id: nextIdeaId(doc.items, tipo), tipo, area, grupo: area, capturada: fecha.slice(0, 10), fase: '', origen: 'pagina',
    titulo: ideaTitle(text), detalle: text, estado: 'nueva', nota: '', respuesta: '', historial: [], actualizado: fecha};
  const entry = {id: fecha + '-' + Math.random().toString(36).slice(2, 8), fecha, quien: USER, accion: 'idea', estado: 'nueva', texto: ''};
  dirty.set(it.id, Object.assign(userFields(it), {historial: [entry], nueva: JSON.parse(JSON.stringify(it))}));
  it.historial.push(entry);
  doc.items.push(it);
  scheduleSave();
  return it;
}
function ideaTitle(text) {
  const line = text.trim().split('\n')[0].trim();
  return line.length <= 90 ? line : line.slice(0, 87).trimEnd() + '…';
}
function saveNote(it) {
  if (!drafts.has(it.id)) return;
  const text = drafts.get(it.id).trim();
  drafts.delete(it.id);
  keepDrafts();
  if (text !== (it.nota || '')) {
    edit(it, {nota: text});
    // "Otra" answer: a note alone answers a question.
    if (it.tipo === 'pregunta' && it.estado === 'sin responder' && text) edit(it, {estado: 'respondida'});
  }
  render();
}
function choose(q, label, on) {
  const picked = q.multiple ? q.opciones.map((o) => o.etiqueta).filter((x) => (x === label ? on : q.eleccion.includes(x))) : [label];
  let estado;
  if (q.tipo === 'confirmar') {
    // Choosing what Claude did confirms it; anything else asks for the change.
    const actual = q.opciones.find((o) => o.actual);
    estado = actual && picked[0] === actual.etiqueta ? 'confirmado' : 'rechazado';
  } else {
    estado = picked.length || q.nota ? 'respondida' : 'sin responder';
  }
  edit(q, {eleccion: picked, estado});
  render();
}
function historyLine(h) {
  const who = h.quien === 'Claude' ? 'Claude' : 'Tú';
  if (h.accion === 'estado') return `${fmtDate(h.fecha)} · ${who} · estado: ${h.estado}`;
  if (h.accion === 'nota') return `${fmtDate(h.fecha)} · ${who} · nota: ${h.texto || '(borrada)'}`;
  if (h.accion === 'eleccion') return `${fmtDate(h.fecha)} · ${who} · eligió: ${h.texto || '(nada)'}`;
  if (h.accion === 'idea') return `${fmtDate(h.fecha)} · ${who} · escribió la idea`;
  if (h.accion === 'texto') return `${fmtDate(h.fecha)} · ${who} · cambió el texto; antes decía: ${h.texto}`;
  return `${fmtDate(h.fecha)} · ${who} · ${h.estado}${h.texto ? ' — ' + h.texto : ''}`;
}

// ---- Rendering -------------------------------------------------------------------------------
function itemsOf(t) {
  if (!doc) return [];
  if (t === 'atencion') return doc.items.filter(needsUser);
  const shown = (it) => filters.archivados || !it.archivado;
  // The analysis: its questions first, then each idea already analyzed.
  if (t === 'analisis') {
    return [...doc.items.filter((it) => it.tipo === 'pregunta' && shown(it)),
      ...doc.items.filter((it) => it.tipo === 'idea' && it.analisis && shown(it))];
  }
  return doc.items.filter((it) => it.tipo === t && shown(it));
}
function applyFilters(list) {
  const q = filters.q.trim().toLowerCase();
  return list.filter((it) =>
    (!filters.fase || it.fase === filters.fase) &&
    (!filters.estado || it.estado === filters.estado) &&
    (!filters.nota || it.nota) &&
    (!q || (it.id + ' ' + it.titulo + ' ' + (it.detalle || '') + ' ' + (it.nota || '') + ' ' + (it.respuesta || '') + ' ' + (it.analisis || '')).toLowerCase().includes(q)));
}
function renderTabs() {
  const nav = $('tabs');
  nav.replaceChildren();
  for (const t of TABS) {
    const items = t.id === 'resumen' || !doc ? null : itemsOf(t.id);
    const n = items && items.length;
    const hot = t.id === 'atencion' && n > 0;
    const done = items && items.filter((it) => !pending(it)).length;
    const count = items == null ? null : t.id === 'atencion' ? String(n) : `${done}/${n}`;
    const tip = items == null || t.id === 'atencion' ? null : `${done} atendidos de ${n}; faltan ${n - done}`;
    nav.append(el('button', {class: tab === t.id ? 'on' : '', onclick: () => {
      tab = t.id; filters.fase = ''; filters.estado = ''; selected.clear();
      if (tab === 'analisis') for (const it of itemsOf(tab)) open.add(it.id);  // Meant to be read, so it opens expanded.
      render();
    }},
      t.label, count == null ? null : el('span', {class: 'n' + (hot ? ' hot' : ''), title: tip}, count)));
  }
}
function stateSelect(it) {
  const s = el('select', {class: 'state s-' + (TONE[it.estado] || 'neutral'), 'aria-label': 'Estado', title: stateHelp(it.tipo, it.estado),
    onchange: (e) => {
      edit(it, {estado: e.target.value});
      // A verified correction that came from a failing check makes the check pass.
      const check = it.tipo === 'correccion' && it.estado === 'verificada' && it.prueba && doc.items.find((x) => x.id === it.prueba);
      if (check && check.estado === 'falla') { edit(check, {estado: 'funciona'}); toast(`La prueba ${check.id} quedó como "funciona".`); }
      render();
    }});
  for (const st of doc.estados[it.tipo]) s.append(el('option', {value: st, selected: st === it.estado, title: stateHelp(it.tipo, st)}, st));
  return s;
}
function card(it, showKind) {
  const isOpen = open.has(it.id);
  const flags = [];
  if (claudeAnswered(it)) flags.push(el('span', {class: 'flag'}, 'Claude respondió'));
  if (forClaude(it)) flags.push(el('span', {class: 'flag'}, 'Para Claude'));
  if (it.retirado) flags.push(el('span', {class: 'chip'}, 'ya no está en los documentos'));
  const c = el('div', {class: 'card' + (isOpen ? ' open' : '') + (it.retirado ? ' retired' : '')});
  const check = el('input', {type: 'checkbox', 'aria-label': 'Seleccionar', checked: selected.has(it.id),
    onchange: (e) => { e.target.checked ? selected.add(it.id) : selected.delete(it.id); renderBulk(); }});
  const title = el('div', {class: 'title', onclick: () => { isOpen ? open.delete(it.id) : open.add(it.id); c.classList.toggle('open'); }},
    el('div', {class: 't'}, it.titulo),
    el('div', {class: 'meta'},
      el('span', {class: 'chip'}, it.id),
      showKind ? el('span', {class: 'chip'}, KIND_LABEL[it.tipo]) : null,
      it.fase && !/^\d+[a-z]?$/.test(it.fase) ? null : (it.fase ? el('span', {class: 'chip'}, 'Fase ' + it.fase) : null),
      it.area ? el('span', {class: 'chip'}, it.area) : null,
      it.capturada ? el('span', {}, it.capturada) : null,
      it.fasePlan ? el('span', {class: 'chip'}, '→ Fase ' + it.fasePlan) : null,
      Array.isArray(it.ideas) && it.ideas.length ? el('span', {}, 'Ideas: ' + it.ideas.join(', ')) : null,
      hasOptions(it) && it.eleccion.length ? el('span', {}, 'Elegiste: ' + it.eleccion.join(', ')) : null,
      it.autor === 'Claude' ? el('span', {class: 'chip'}, 'de Claude') : null,
      it.desde ? el('span', {class: 'chip', title: 'Salió de este elemento'}, 'de ' + it.desde) : null,
      it.prueba ? el('span', {class: 'chip', title: 'Prueba manual que falló'}, 'prueba ' + it.prueba) : null,
      it.correccion ? el('span', {class: 'chip', title: 'Corrección que la atiende'}, '→ ' + it.correccion) : null,
      it.ideaCreada ? el('span', {class: 'chip', title: 'Idea creada a partir de tu nota'}, '→ ' + it.ideaCreada) : null,
      it.archivado ? el('span', {class: 'chip'}, 'archivada') : null,
      it.nota ? el('span', {}, '✎ tu nota') : null,
      drafts.has(it.id) ? el('span', {class: 'flag'}, 'nota sin guardar') : null,
      ...flags));
  c.append(el('div', {class: 'head'}, check, title, stateSelect(it)));
  const body = el('div', {class: 'body'});
  if (it.tipo === 'idea' || it.tipo === 'correccion') body.append(ideaBody(it));
  else if (it.detalle) body.append(markdown(it.detalle));
  if (hasOptions(it)) body.append(optionsOf(it));
  if (it.respuesta) body.append(el('div', {class: 'answer'}, el('b', {}, 'Claude: '), it.respuesta));
  const area = el('textarea', {placeholder: hasOptions(it) ? 'Otra respuesta, o un comentario sobre tu elección…'
    : 'Tu nota: qué ves, qué autorizas, qué falta definir…'});
  area.value = drafts.has(it.id) ? drafts.get(it.id) : (it.nota || '');
  const saveBtn = el('button', {class: 'btn primary', title: 'Guarda la nota (Ctrl+Enter)', onclick: () => saveNote(it)}, '✓ Guardar nota');
  const discardBtn = el('button', {class: 'btn', onclick: () => { drafts.delete(it.id); keepDrafts(); render(); }}, 'Descartar cambios');
  const hint = el('span', {class: 'hint'});
  const sync = () => {
    const changed = drafts.has(it.id);
    saveBtn.disabled = !changed;
    discardBtn.hidden = !changed;
    area.classList.toggle('draft', changed);

// Salvador's words as he wrote them; Claude's analysis first where it is what to read.

  if (!it.analisis) { box.append(original); return box; }
  const analysis = el('div', {class: 'analysis'}, el('b', {}, 'Análisis de Claude'), markdown(it.analisis));
  if (tab === 'analisis') box.append(analysis, el('details', {class: 'hist'}, el('summary', {}, 'Tu idea tal como la escribiste'), original));
  else box.append(original, el('details', {class: 'hist'}, el('summary', {}, 'Análisis de Claude'), markdown(it.analisis)));

function textEditor(it, original) {
  const KEY = 'texto:' + it.id;

    box.replaceChildren();
    if (!drafts.has(KEY)) {
      box.append(original, el('div', {class: 'note-actions'},
        el('button', {class: 'btn', onclick: () => { drafts.set(KEY, it.detalle); keepDrafts(); show(); }}, '✎ Editar texto'),
        el('span', {class: 'hint'}, 'Se puede cambiar mientras esté "nueva".')));
      return;
    }
    const area = el('textarea', {class: 'draft', 'aria-label': 'Texto'});
    area.value = drafts.get(KEY);
    const done = () => {
      const text = area.value.trim();
      drafts.delete(KEY);
      keepDrafts();
      if (text) editText(it, text);
      render();
    };
    area.addEventListener('input', () => { drafts.set(KEY, area.value); keepDrafts(); });
    area.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); done(); } });
    box.append(area, el('div', {class: 'note-actions'},
      el('button', {class: 'btn primary', title: 'Ctrl+Enter', onclick: done}, '✓ Guardar texto'),
      el('button', {class: 'btn', onclick: () => { drafts.delete(KEY); keepDrafts(); render(); }}, 'Cancelar'),
      el('span', {class: 'hint'}, 'El texto anterior queda en el historial.')));
  };
  show();
  return box;
}
function optionsOf(q) {

      el('span', {}, el('b', {}, o.etiqueta), o.actual ? el('span', {class: 'flag'}, 'lo que hice') : null,
        o.recomendada ? el('span', {class: 'flag'}, 'recomendada') : null,

function newIdeaForm(tipo) {
  const c = CAPTURE[tipo];
  const KEY = '__nueva-' + tipo;
  const area = el('select', {'aria-label': 'Área'}, AREAS.map((a) => el('option', {value: a}, a)));
  try { area.value = localStorage.getItem('revision.area') || 'Juego'; } catch (e) { /* Default area. */ }
  const text = el('textarea', {placeholder: c.placeholder});
  text.value = drafts.get(KEY) || '';
  const add = () => {
    const t = text.value.trim();
    if (!t) { text.focus(); return; }
    const it = addIdea(tipo, area.value, t);
    try { localStorage.setItem('revision.area', area.value); } catch (e) { /* Not kept. */ }
    drafts.delete(KEY);
    keepDrafts();
    toast(`${c.done} ${it.id} agregada.`);
    render();
  };
  text.addEventListener('input', () => { if (text.value) drafts.set(KEY, text.value); else drafts.delete(KEY); keepDrafts(); });
  text.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); add(); } });
  return el('div', {class: 'box newidea'}, el('h3', {}, c.title), text,
    el('div', {class: 'note-actions'}, area, el('button', {class: 'btn primary', title: 'Ctrl+Enter', onclick: add}, c.button),
      el('span', {class: 'hint'}, handle ? '' : 'Solo lectura en este navegador: usa Descargar para no perderla.')));
}
function renderBulk() {
  const box = $('bulk');

  box.replaceChildren();

  box.append(el('button', {class: 'btn', onclick: () => { visible.forEach((it) => selected.add(it.id)); render(); }}, 'Seleccionar visibles'));
  if (selected.size) {

    const kinds = new Set(doc.items.filter((it) => selected.has(it.id)).map((it) => it.tipo));
    const sel = el('select', {'aria-label': 'Nuevo estado'});
    sel.append(el('option', {value: ''}, `Cambiar ${selected.size} seleccionado(s) a…`));

    else sel.append(el('option', {value: '', disabled: true}, 'Selecciona un solo tipo'));
    sel.addEventListener('change', () => {
      if (!sel.value) return;
      for (const it of doc.items) if (selected.has(it.id)) edit(it, {estado: sel.value});

}
function renderList() {
  const t = TABS.find((x) => x.id === tab);

  const list = applyFilters(all);

    main.append(el('p', {class: 'intro'}, all.length
      ? 'Respuestas mías que esperan tu lectura y decisiones que esperan tu confirmación. Al cambiar un estado o escribir una nota, sale de aquí.'
      : 'Nada espera por ti ahora mismo.'));
    const mine = doc.items.filter(forClaude);
    if (mine.length) main.append(el('p', {class: 'intro'}, `${mine.length} elemento(s) esperan que yo los lea (autorizados, a cambiar, con fallas o con tu nota).`));
  } else if (t.intro) {
    main.append(el('p', {class: 'intro'}, t.intro));
    main.append(stateLegend(tab === 'analisis' ? ['pregunta', 'idea'] : [tab]));
  }

  // Filters.

  const search = el('input', {type: 'search', placeholder: 'Buscar…', value: filters.q});

    el('option', {value: ''}, 'Todas las fases'), fases.map((x) => el('option', {value: x, selected: x === filters.fase}, /^\d/.test(x) ? 'Fase ' + x : x)));
  const states = tab === 'atencion' ? [...new Set(all.map((it) => it.estado))] : (doc.estados[tab] || []);
  const ssel = el('select', {'aria-label': 'Estado', onchange: (e) => { filters.estado = e.target.value; render(); }},
    el('option', {value: ''}, 'Todos los estados'), states.map((x) => el('option', {value: x, selected: x === filters.estado}, x)));

    el('input', {type: 'checkbox', checked: filters.ocultarAtendidos, onchange: (e) => {

    el('button', {class: 'btn', onclick: () => { open.clear(); render(); }}, 'Cerrar todos'));

function renderBody() {
  const box = $('list');
  box.replaceChildren();
  const all = applyFilters(itemsOf(tab));
  const list = filters.ocultarAtendidos && tab !== 'atencion' ? all.filter(pending) : all;
  if (!list.length) {
    box.append(el('div', {class: 'empty'}, all.length ? 'Todo lo de aquí ya está atendido.' : 'No hay elementos con estos filtros.'));
    return;
  }
  // Grouped by phase, newest first for changes, in order for the rest; what
  // still waits for Salvador goes first, in each group and among the groups.
  const groups = new Map();
  for (const it of list) {
    const key = tab === 'analisis' ? (it.tipo === 'pregunta' ? 'Preguntas' : 'Ideas · ' + it.area)
      : it.grupo || (it.fase ? 'Fase ' + it.fase : 'General');
    if (!groups.has(key)) groups.set(key, {fase: it.fase, items: []});
    groups.get(key).items.push(it);
  }
  let keys = [...groups.keys()];
  keys.sort((a, b) => faseKey(groups.get(a).fase) - faseKey(groups.get(b).fase));
  if (tab === 'cambio') keys.reverse();
  const left = (k) => groups.get(k).items.filter(pending).length;
  keys = [...keys.filter((k) => left(k) > 0), ...keys.filter((k) => left(k) === 0)];
  for (const k of keys) {
    const items = groups.get(k).items;
    const done = items.length - left(k);
    box.append(el('h2', {class: 'group'}, k, tab === 'atencion' ? null : el('span', {class: 'count'}, ` · ${done}/${items.length}`)));
    for (const it of [...items.filter(pending), ...items.filter((x) => !pending(x))]) box.append(card(it, tab === 'atencion'));
  }
}
function renderSummary() {

      legend.append(el('span', {}, el('span', {style: `color:${color}`}, '■ '), `${st} ${counts[st]}`));

      el('td', {class: 'num'}, tests.filter((x) => x.estado === 'falla').length),
